[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "agent",
    "booking_agent",
    "config",
    "crm_writer",
    "db",
    "eval_harness",
    "evidence_graph",
    "icp_classifier",
    "mechanism",
    "nurture_sequencer",
    "observability",
    "probes",
    "signal_pipeline",
    "webhooks",
]

[project]
name = "conversion-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.136.0",
    "httpx>=0.28.0",
    "hypothesis>=6.152.1",
    "langchain-core>=1.3.0",
    "langchain-openai>=1.2.0",
    "langfuse[openai]>=4.5.0",
    "langgraph>=1.1.9",
    "playwright>=1.58.0",
    "pydantic>=2.13.3",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
    "resend>=2.10.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.44.0",
]
